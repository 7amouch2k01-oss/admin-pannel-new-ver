# =============================================================================
#  Styly Admin Console — nginx site
#
#  Install on the server (one-time):
#     sudo cp deploy/nginx/admin.styly.tn.conf /etc/nginx/sites-available/admin.styly.tn
#     sudo ln -s /etc/nginx/sites-available/admin.styly.tn /etc/nginx/sites-enabled/
#     sudo certbot --nginx -d admin.styly.tn
#     sudo nginx -t && sudo systemctl reload nginx
#
#  This file is version-controlled on purpose. The API's nginx config lives only on
#  the box (its repo's nginx/ directory is empty), which means nobody can review it,
#  diff it, or restore it after a server rebuild. Don't repeat that here.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.styly.tn;
    # certbot manages the ACME location; everything else goes to TLS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.styly.tn;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/admin.styly.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.styly.tn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # `current` is a symlink the deploy flips atomically; nginx resolves it per
    # request, so a release swap needs no reload.
    root /var/www/styly/admin/current;
    index index.html;

    access_log /var/log/nginx/admin.styly.tn.access.log;
    error_log  /var/log/nginx/admin.styly.tn.error.log;

    # This console shows user PII, order data and payout bank details. Its only gate
    # is the app login (JWT + requireAdmin + per-module permissions, all enforced
    # server-side), so keep it out of search engines and out of frames.
    add_header X-Robots-Tag        "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options     "DENY"              always;
    add_header Referrer-Policy     "same-origin"       always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API and media, proxied so the console is SAME-ORIGIN with the API ──────
    # This is what lets the SPA ship with no VITE_API_BASE_URL, keeps the stored
    # /files/<uuid> paths relative, and means the API needs no CORS_ORIGIN entry.
    # NOTE: the upstream port must match the backend's PORT secret.
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        # Keep in step with MAX_VIDEO_UPLOAD_SIZE_MB on the API.
        client_max_body_size 60m;
        proxy_read_timeout   120s;
    }

    location /files/ {
        proxy_pass       http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }

    # ── Static assets ─────────────────────────────────────────────────────────
    # Vite content-hashes these filenames, so they can be cached forever.
    # `try_files ... =404` matters: without it the SPA fallback below would answer
    # a missing asset with index.html, and the browser would fail to parse HTML
    # as JavaScript while the network tab showed a misleading 200.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # index.html must never be cached, or a returning user boots a stale bundle
    # that references asset filenames the last deploy deleted.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── SPA history fallback ──────────────────────────────────────────────────
    # wouter uses real paths (/admin/users, /admin/orders, …). Without this, a
    # refresh or a pasted deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
