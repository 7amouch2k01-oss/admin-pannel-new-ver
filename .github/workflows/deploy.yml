name: Deploy Admin Console

# Mirrors the backend's pipeline (Wrapped-Tn/stylyServer -> .github/workflows/deploy.yml):
# same SSH actions, same "deploy" GitHub Environment convention. The shape differs in one
# way: the backend has the SERVER pull the code and build in place, which suits a Node
# service. This is a static SPA, so it is built HERE on the runner and only the artifact is
# shipped — no Node, no PM2 and no build toolchain on the box.
on:
  push:
    branches:
      - main
  # Redeploy without a commit — invaluable when a deploy half-fails.
  workflow_dispatch:

# Never let two deploys interleave the release swap.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Secrets live in the "deploy" Environment, matching the backend.
    # Settings > Environments > New environment > name it "deploy".
    # Required: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, SERVER_PORT, WEB_ROOT
    environment: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth, so CI and local dev cannot drift.
          # (The backend runs `nvm install --lts` on the server instead — an unpinned,
          # time-varying version, which is what broke bcrypt's native build on the
          # Ubuntu 24 rebuild. A static site needs no Node on the box at all.)
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE GATE: a failed build never reaches the server.
      # VITE_API_BASE_URL is deliberately unset — nginx serves the SPA and proxies /api
      # and /files on the same origin, so the client uses relative URLs and needs no CORS.
      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/public/index.html || { echo "::error::index.html missing from build"; exit 1; }
          test -d dist/public/assets     || { echo "::error::assets/ missing from build"; exit 1; }
          echo "Build size: $(du -sh dist/public | cut -f1)"

      # Staged through /tmp because WEB_ROOT may not exist on the first run —
      # same trick the backend uses for its .env.
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/public/*"
          target: "/tmp/admin-${{ github.sha }}"
          strip_components: 2

      - name: Publish release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            WEB_ROOT="${{ secrets.WEB_ROOT }}"
            SHA="${{ github.sha }}"
            STAGE="/tmp/admin-$SHA"
            REL="$WEB_ROOT/releases/$SHA"

            test -f "$STAGE/index.html" || { echo "❌ upload incomplete — index.html not staged"; exit 1; }

            mkdir -p "$WEB_ROOT/releases"
            rm -rf "$REL"
            mv "$STAGE" "$REL"

            # Atomic swap: nginx follows the symlink per request, so no reload is needed
            # and no visitor can ever observe a half-copied directory.
            ln -sfn "$REL" "$WEB_ROOT/current.tmp"
            mv -Tf "$WEB_ROOT/current.tmp" "$WEB_ROOT/current"
            echo "✅ current -> $(readlink -f "$WEB_ROOT/current")"

            # Keep the last 5 releases so a rollback is one symlink flip.
            ls -1dt "$WEB_ROOT"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
            echo "📦 releases retained: $(ls -1 "$WEB_ROOT/releases" | wc -l)"

      # Hits the PUBLIC url, so DNS, TLS, nginx and the API proxy are all exercised —
      # not just "did the files land". Same idea as the backend's smoke test.
      - name: Smoke test
        env:
          SITE: ${{ secrets.SITE_URL || 'https://admin.styly.tn' }}
        run: |
          set -e
          echo "🔎 $SITE"
          code=$(curl -fsS -o /tmp/index.html -w '%{http_code}' "$SITE/") 
          echo "  index.html      $code"
          grep -q 'id="root"' /tmp/index.html || { echo "::error::index.html has no #root — wrong file served"; exit 1; }

          asset=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' /tmp/index.html | head -1)
          [ -n "$asset" ] || { echo "::error::no hashed asset referenced"; exit 1; }
          ctype=$(curl -fsS -o /dev/null -w '%{content_type}' "$SITE$asset")
          echo "  $asset  $ctype"
          case "$ctype" in *javascript*) ;; *) echo "::error::asset served as $ctype (SPA fallback swallowing /assets?)"; exit 1 ;; esac

          # Deep link must fall back to index.html, or a refresh on /admin/orders 404s.
          deep=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE/admin/orders")
          echo "  /admin/orders   $deep"

          # The API must answer on the SAME origin, else the console cannot talk to it.
          api=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE/api/categories")
          echo "  /api/categories $api"
          [ "$api" = "200" ] || { echo "::error::API not reachable through the console origin — check the nginx proxy"; exit 1; }
